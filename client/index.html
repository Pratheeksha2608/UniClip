<!DOCTYPE html>
<html>
<head>
    <title>UniClip</title>
</head>
<body>
    <h1>UniClip</h1>

    <button id="createSessionButton">Create Session</button>

    <br><br>

    <input id="sessionCodeInput" type="text" placeholder="Enter session code">
    <button id="joinSessionButton">Join Session</button>

    <p id="sessionState">Not in a session</p>
    <p id="sessionStatus"></p>
    <p id="sessionMessage"></p>

    <button id="leaveSessionButton">Leave Session</button>

    <br><br>

    <button id="syncClipboardButton">Sync Clipboard</button>
    
    <h2>Clipboard History</h2>
    <button id="clearHistoryButton">Clear History</button>
    <div id="clipboardHistory"></div>

    <script src="app.js"></script>
</body>
</html>
