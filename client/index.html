<!DOCTYPE html>
<html>
<head>
    <title>UniClip</title>
</head>
<body>
    <h1>UniClip</h1>

    <button id="createSessionButton">Create Session</button>

    <br><br>

    <input id="sessionCodeInput" type="text" placeholder="Enter session code">
    <button id="joinSessionButton">Join Session</button>

    <p id="sessionStatus"></p>

    <input id="messageInput" type="text" placeholder="Type a message">
    <button id="sendButton">Send</button>
    <button id="readClipboardButton">Read Clipboard</button>
    <button id="writeClipboardButton">Write Clipboard</button>
    <button id="syncClipboardButton">Sync Clipboard</button>
    <button id="copyReceivedButton">Copy Received Text</button>

    <script src="app.js"></script>
</body>
</html>
